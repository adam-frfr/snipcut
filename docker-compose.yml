# Snipcut on a VPS:  docker compose up -d --build
# HTTPS, either:
#  - built in: set DOMAIN in .env and run  docker compose --profile https up -d --build
#  - or your own reverse proxy (deploy/Caddyfile, deploy/nginx.conf) in front
#    of port 3000, which stays bound to localhost.
# Moving servers: deploy/backup.sh on the old one, deploy/restore.sh on the new one.
services:
  snipcut:
    build: .
    image: snipcut:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Jobs, caches, saved YouTube cookies, your music, chunked-upload parts
      - snipcut-data:/app/data
      # Source videos and finished clips
      - snipcut-uploads:/app/public/uploads
      - snipcut-downloads:/app/public/downloads
      - snipcut-clips:/app/public/rendered_clips

  # Optional HTTPS (Let's Encrypt) — only runs with  --profile https
  caddy:
    image: caddy:2.8
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - snipcut
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  snipcut-data:
  snipcut-uploads:
  snipcut-downloads:
  snipcut-clips:
  caddy-data:
  caddy-config:
