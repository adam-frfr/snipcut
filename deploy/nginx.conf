# nginx alternative to deploy/Caddyfile. Replace clips.example.com, put this
# in /etc/nginx/sites-available/snipcut, symlink it into sites-enabled, then
# get a certificate with:  sudo certbot --nginx -d clips.example.com
server {
    listen 80;
    server_name clips.example.com;

    # nginx's default 1 MB limit rejects every 2 MB upload chunk (HTTP 413).
    client_max_body_size 2200m;
    # Stream uploads straight through instead of buffering them on disk first.
    proxy_request_buffering off;

    # Video playback/downloads use range requests; don't buffer big files.
    proxy_buffering off;

    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
